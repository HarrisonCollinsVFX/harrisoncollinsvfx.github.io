<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harrison Collins – 2026 VFX Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--panel:#111;--line:#262626;--tx:#e8e6e1;--mut:#8a8780;--dim:#55534e;--amb:#ffb000;
--serif:"Instrument Serif","Times New Roman",serif;--sans:Inter,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.6 var(--sans);overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--amb);outline-offset:3px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.amb{color:var(--amb)}.mut{color:var(--mut)}
header{position:fixed;inset:0 0 auto;z-index:20;height:56px;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 max(20px,calc((100vw - 1272px)/2))}
header nav{display:flex;gap:28px}
header nav a{color:var(--mut)}header nav a.on{color:var(--amb)}
#bar{position:absolute;left:0;bottom:-1px;height:1px;width:calc(var(--p,0)*100%);background:var(--amb)}
main{padding-top:56px}
.page{display:none}.page.on{display:block}
.wrap{max-width:1272px;margin:0 auto;padding:0 20px}
/* hero */
.hero{position:relative;min-height:calc(100vh - 56px);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:48px 20px 56px;
background:#0a0a0a}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(0,0,0,.88),rgba(0,0,0,.4) 70%,rgba(0,0,0,.55))}
.hero-bg{position:absolute;inset:-60px;z-index:0;overflow:hidden;filter:blur(26px) saturate(.9)}
.hero-bg i{position:absolute;border-radius:50%}
.hero-bg video{width:100%;height:100%;object-fit:cover}
.hero-bg iframe{position:absolute;left:50%;top:50%;width:max(100%,178vh);height:max(100%,56.25vw);transform:translate(-50%,-50%);border:0;pointer-events:none}
.hero>*:not(.hero-bg){position:relative;z-index:2;max-width:1272px;width:100%;margin:0 auto}
.hero h1{font:400 clamp(64px,13vw,190px)/.88 var(--serif);letter-spacing:-.02em;text-transform:uppercase}
.hero h1 span{display:block}.hero h1 span+span{text-align:right}
.hero .sub{margin-top:18px}
.hero-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.cue{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--mut)}
.cue i{width:1px;height:46px;background:var(--amb);transform-origin:top;animation:cue 2.2s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
/* reel */
.reel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;padding:96px 0 48px;flex-wrap:wrap}
h2,h3.t{font:400 clamp(38px,5vw,64px)/1 var(--serif);letter-spacing:-.01em}
.reel{position:relative;max-width:1272px;margin:0 auto;border:1px solid var(--line);border-top:1px solid var(--amb);background:linear-gradient(var(--panel),var(--bg))}
.rail{position:absolute;top:0;bottom:0;width:20px;pointer-events:none;
background:repeating-linear-gradient(180deg,transparent 0 10px,#1c1c1c 10px 34px,transparent 34px 44px);
background-position:0 calc(var(--sy,0px)*-.6);-webkit-mask:linear-gradient(90deg,#000 0 0);border-radius:3px}
.rail.l{left:-48px}.rail.r{right:-48px}
.frame{padding:72px 56px;border-bottom:1px solid var(--line);position:relative}
.frame:last-child{border-bottom:0}
.ftop{display:flex;justify-content:space-between;margin-bottom:20px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:48px}
.still{position:relative;aspect-ratio:var(--ar,16/9);border:1px solid var(--line);overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;padding:28px;gap:16px;background:var(--g)}
.still img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.still::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent 55%)}
.still>*:not(img){position:relative;z-index:1}
.still.vid{display:block;padding:0;background:#000}.still.vid::after{display:none}
.still.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.still.vid iframe,.shot iframe,.shot video{transform:scale(var(--z,1))}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:18px}
.cap h3.t{font-size:clamp(30px,3.6vw,46px)}
.still .ph{position:absolute;top:16px;left:16px;z-index:1;border:1px solid var(--amb);padding:3px 8px;color:var(--amb);background:rgba(0,0,0,.5)}
.mark{position:absolute;z-index:1;border:1px solid var(--amb);width:84px;height:84px;top:14%;right:8%}
.meta{border-left:1px solid var(--line);padding-left:20px;display:grid;gap:18px;align-content:start}
.meta dt{color:var(--dim)}.meta dd{font:13px/1.5 var(--mono);margin:2px 0 0}
.contrib{border-left:2px solid var(--amb);padding-left:20px;margin-top:28px}
.desc{max-width:62ch;color:var(--mut);margin:28px 0 56px;font-size:17px}
.bd-title{display:flex;gap:16px;align-items:center;color:var(--dim);margin-bottom:20px}
.bd-title::after{content:"";flex:1;height:1px;background:var(--line)}
.shots{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:28px}
.shot figure{position:relative;aspect-ratio:var(--ar,16/9);border:1px solid var(--line);background:var(--g);overflow:hidden;display:grid;place-items:center}
.shot video,.shot iframe,.shot img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;background:#000}
.shot .tag{position:absolute;top:10px;left:10px;border:1px solid var(--line);background:rgba(10,10,10,.8);padding:2px 8px;color:var(--mut);z-index:2;pointer-events:none}
.pp{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mut);text-align:center;padding:12px}
.pp b{width:44px;height:44px;border:1px solid var(--mut);border-radius:50%;display:grid;place-items:center;font-size:14px}
.shot h4{margin:14px 0 4px;font-weight:500;color:var(--amb)}
.shot p{color:var(--mut);font-size:14px;line-height:1.55}
/* index dots */
#idx{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:15;display:none;flex-direction:column;gap:14px;align-items:flex-end}
#idx.show{display:flex}
#idx a{color:var(--dim);display:flex;gap:8px;align-items:center}
#idx a::after{content:"";width:10px;height:1px;background:currentColor;transition:width .3s}
#idx a.on{color:var(--amb)}#idx a.on::after{width:28px}
.btns{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{display:inline-flex;gap:10px;align-items:center;padding:16px 24px;border:1px solid #3a3a3a;font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;background:none;color:var(--tx);cursor:pointer}
.btn.pri{background:var(--amb);border-color:var(--amb);color:#111}
.strip{height:34px;margin:56px auto;max-width:1272px;border-block:1px solid var(--line);background:repeating-linear-gradient(90deg,transparent 0 6px,#1c1c1c 6px 28px,transparent 28px 34px) 0 50%/auto 14px no-repeat;background-repeat:repeat-x}
.end{padding:0 20px 96px;max-width:1272px;margin:0 auto}
footer{padding:28px 20px;border-top:1px solid var(--line);text-align:center;color:var(--dim)}
.rv{opacity:0;transform:translateY(16px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
@media(max-width:1100px){.rail{display:none}#idx{display:none!important}.frame,.coda{padding:48px 24px}}
@media(max-width:860px){.grid{grid-template-columns:1fr}.shots{grid-template-columns:1fr}.meta{border-left:0;padding-left:0;grid-template-columns:1fr 1fr}.hero-foot .cue{display:none}.hero h1 span+span{text-align:left}header nav{gap:16px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}.cue i{animation:none}.rail{background-position:0 0!important}}
</style>
</head>
<body>
<header>
  <a href="#/" class="mono amb logo">2026 VFX Portfolio</a>
  <nav class="mono" aria-label="Main">
    <a href="#/" data-r="home">Portfolio</a>
  </nav>
  <div id="bar"></div>
</header>
<nav id="idx" class="mono" aria-label="Projects"></nav>

<main>
<!-- HOME -->
<section class="page" id="home">
  <div class="hero">
    <div class="hero-bg" id="heroBg" aria-hidden="true">
      <i style="left:55%;top:5%;width:46%;height:60%;background:rgba(255,176,0,.38)"></i>
      <i style="left:6%;top:42%;width:38%;height:52%;background:rgba(90,110,140,.38)"></i>
      <i style="left:40%;top:62%;width:32%;height:40%;background:rgba(160,60,40,.32)"></i>
    </div>
    <div>
      <h1><span>Harrison</span><span>Collins</span></h1>
    </div>
    <div class="hero-foot">
      <div><p class="mono amb">VFX artist</p><p class="mono mut" style="margin-top:10px;max-width:30ch">Compositing, Roto &amp; Paint</p></div>
      <a href="#reel" class="cue mono" id="startReel"><span>Start reel</span><i></i></a>
    </div>
  </div>

  <div class="wrap" id="reel">
    <div class="reel-head">
      <div><p class="mono amb">The reel</p><h2 style="margin-top:14px">Scroll to unwind the reel.</h2></div>
      <div style="max-width:34ch"><p class="mut" style="font-size:14px">Each project sits in its own frame: the finished shot first, then the breakdowns behind it.</p><p class="mono amb" style="margin-top:8px"></p></div>
    </div>
  </div>
  <div class="reel" id="frames"><span class="rail l"></span><span class="rail r"></span></div>

  <div class="strip" aria-hidden="true"></div>
  <div class="wrap"><div class="btns" style="justify-content:center"><a class="btn" href="#top" id="rewind">Rewind to top</a></div></div>
  <p class="mono amb end" style="margin-top:56px">End of reel</p>
</section>

</main>
<footer class="mono">© 2026 Harrison Collins</footer>

<script>

const PROJECTS=[
{title:"Cursed Pages",kind:"Student Short Film - Escape Studios",year:"2026",role:"Comp · DMP · Roto & Prep",tools:"Nuke · Photoshop · DaVinci Resolve",
 contrib:"I was responsible for 3 shots, where I handled complex cleanup, CG integration and DMP.",
 desc:"Over the course of 5 months, I worked with 10 other artists to create a short film based on the prompt, 'A girl develops the power to jump into books and interact with the stories.'",
 finished:"",mainEmbed:"https://player.vimeo.com/video/1198840329",ratio:"1998/1080",g:"linear-gradient(135deg,#1b1a17,#2a2216 60%,#0b0b0b)",
 shots:[{tag:"Breakdown 1",label:"Breakdown 1",desc:"Full breakdown of complex cleanup, DMP, CG integration and roto.",embed:"https://player.vimeo.com/video/1198998153"},
        {tag:"Breakdown 2",label:"Breakdown 2",desc:"Full breakdown of tracking marker removal and CG integration.",embed:"https://player.vimeo.com/video/1236039577?h=3e8cf6859a"},
        {tag:"Breakdown 3",label:"Breakdown 3",desc:"Full breakdown of cleanup, DMP and roto.",embed:"https://player.vimeo.com/video/1236039584?h=16a020ef93"}]},
{title:"Roto",kind:"",year:"2025",role:"Solo Project",roleLabel:"",tools:"Silhouette · Nuke",
 contrib:"",
 desc:"Roto project, created with Nuke and Silhouette.",
 finished:"",mainEmbed:"https://player.vimeo.com/video/1242582824?h=cfc0e7a8ca",g:"linear-gradient(135deg,#141a24,#3a2a1a 55%,#0b0b0b)",
 shots:[{tag:"Overlay",label:"Overlay",desc:"",embed:"https://player.vimeo.com/video/1242581718?h=de3f36cfd5"},
        {tag:"Alpha",label:"Alpha",desc:"",embed:"https://player.vimeo.com/video/1242581730?h=f5efda2bc0"},
        {tag:"Checkerboard",label:"Checkerboard",desc:"",embed:"https://player.vimeo.com/video/1242581719?h=247622c5b1"}]},
{title:"Beauty Cleanup",kind:"",year:"2026",role:"Solo Project",roleLabel:"",tools:"Nuke",
 contrib:"",cols:2,
 desc:"Beauty cleanup shot using frequency separation to maintain detail on the face. I used machine learning with CopyCat within Nuke to speed up the process and to understand the fundamentals of ML tools.",
 finished:"",mainEmbed:"https://player.vimeo.com/video/1242163053",ratio:"1998/1080",g:"linear-gradient(135deg,#102020,#1d2b2b 55%,#0b0b0b)",
 shots:[{tag:"Scan",label:"Scan",desc:"",embed:"https://player.vimeo.com/video/1242178278"},
        {tag:"Frequency",label:"Frequency",desc:"I used frequency separation within Nuke to retain detail on the face.",embed:"https://player.vimeo.com/video/1242163055"}]},
{title:"6 Week Team Project",kind:"",year:"2025",role:"Keying & Comp",tools:"Nuke",
 contrib:"Responsible for keying and integration of fire, smoke and grass.",
 desc:"In a team of 5 across many disciplines, we worked for 6 weeks to film, track, create a CG environment and composite it into a short shot.",
 finished:"",mainEmbed:"https://player.vimeo.com/video/1242178283",ratio:"1998/1080",g:"linear-gradient(135deg,#221018,#2b1a22 55%,#0b0b0b)",
 shots:[{tag:"Final key",label:"Final Key",desc:"",embed:"https://player.vimeo.com/video/1242178282"}]}
];
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Apply muted autoplay and continuous looping to every Vimeo player. */
function vimeoPlaybackUrl(src){
  const url=new URL(src,location.href);
  url.searchParams.set("autoplay","1");
  url.searchParams.set("muted","1");
  url.searchParams.set("loop","1");
  url.searchParams.set("autopause","0");
  return url.toString();
}
function media(s,g){
  if(s.embed)return `<iframe src="${esc(vimeoPlaybackUrl(s.embed))}" title="${esc(s.label)}" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  if(s.video)return `<video controls preload="none" playsinline ${s.poster?`poster="${esc(s.poster)}"`:""}><source src="${esc(s.video)}"></video>`;
  return "";
}
const frames=$("#frames"),idx=$("#idx");
PROJECTS.forEach((p,i)=>{
  const n=pad(i+1),total=pad(PROJECTS.length);
  frames.insertAdjacentHTML("beforeend",`
  <article class="frame rv" id="p${n}" aria-label="${esc(p.title)}" style="--ar:${p.ratio||'16/9'};--z:${p.zoom||1};--cols:${p.cols||3}">
    <div class="ftop mono"><span class="amb">Frame_${n} <span style="color:var(--dim)">/ ${total}</span></span><span></span></div>
    <div class="grid">
      <div>${p.mainEmbed?`<div class="still vid"><iframe src="${esc(vimeoPlaybackUrl(p.mainEmbed))}" title="${esc(p.title)}" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div><div class="cap"><h3 class="t">${esc(p.title)}</h3>${p.kind?`<span class="mono amb">${esc(p.kind)}</span>`:""}</div>`:`      <div class="still" style="--g:${p.g}">
        ${p.finished?`<img src="${esc(p.finished)}" alt="${esc(p.title)} finished shot" loading="lazy">`:""}
        <span class="mark" aria-hidden="true"></span>
        <h3 class="t">${esc(p.title)}</h3><span class="mono amb" style="text-align:right">${esc(p.kind)}</span>
      </div>`}</div>
      <aside>
        <dl class="meta">
          <div><dt class="mono">Year</dt><dd>${esc(p.year)}</dd></div>
          <div>${p.roleLabel===""?"":`<dt class="mono">Role</dt>`}<dd>${esc(p.role)}</dd></div>
          <div><dt class="mono">Tools</dt><dd>${esc(p.tools)}</dd></div>
        </dl>
        ${p.contrib?`<div class="contrib"><p class="mono amb">My contribution</p><p class="mut" style="font-size:14px;margin-top:8px">${esc(p.contrib)}</p></div>`:""}
      </aside>
    </div>
    <p class="desc">${esc(p.desc)}</p>
    <p class="bd-title mono">Breakdown sequence</p>
    <div class="shots">${p.shots.map((s,k)=>`
      <div class="shot"><figure style="--g:${p.g}"><span class="tag mono">Shot_${n}${"abc"[k]}</span>${media(s,p.g)}</figure>
      <h4 class="mono">${esc(s.label)}</h4><p>${esc(s.desc)}</p></div>`).join("")}
    </div>
  </article>`);
  idx.insertAdjacentHTML("beforeend",`<a href="#p${n}" data-i="${n}" aria-label="Go to project ${n}">${n}</a>`);
});

/* routing */
function route(){
  const h=location.hash;
  if(h.startsWith("#p")||h==="#reel"||h==="#top"){
    const el=h==="#top"?null:document.getElementById(h.slice(1));
    setTimeout(()=>el?el.scrollIntoView():scrollTo({top:0}),0);return;
  }
  scrollTo(0,0);
}
document.getElementById("home").classList.add("on");
idx.classList.add("show");
document.title="Harrison Collins – 2026 VFX Portfolio";
addEventListener("hashchange",route);

/* scroll-linked unwinding (native scroll, no hijacking) */
const rm=matchMedia("(prefers-reduced-motion: reduce)");let tick=false;
function onScroll(){
  if(tick)return;tick=true;
  requestAnimationFrame(()=>{
    tick=false;
    const max=document.documentElement.scrollHeight-innerHeight;
    document.documentElement.style.setProperty("--p",max>0?Math.min(1,scrollY/max):0);
    if(!rm.matches)document.documentElement.style.setProperty("--sy",scrollY+"px");
  });
}
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);

/* reveal + current-frame tracking */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");
    const n=e.target.id.slice(1);document.querySelectorAll("#idx a").forEach(a=>a.classList.toggle("on",a.dataset.i===n));}
}),{threshold:.25});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));

/* Full showreel as blurred hero background: set a video file here (muted loop, no audio) */
const HERO_EMBED="https://player.vimeo.com/video/1181728613?background=1&autoplay=1&loop=1&muted=1"; /* blurred hero reel (Vimeo background mode) */
const HERO_VIDEO=""; /* or a self-hosted file, e.g. "reel.mp4" */
if(!rm.matches&&(HERO_EMBED||HERO_VIDEO)){
  const el=HERO_EMBED?Object.assign(document.createElement("iframe"),{src:vimeoPlaybackUrl(HERO_EMBED),title:"Showreel background",allow:"autoplay"}):Object.assign(document.createElement("video"),{src:HERO_VIDEO,muted:true,loop:true,playsInline:true,autoplay:true});
  $("#heroBg").replaceChildren(el);
}
route();
</script>
</body>
</html>
